[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PharmaPy"
version = "0.0.1"
description = "A numerical platform for the digital design of pharmaceutical processes"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "Daniel Casas-Orozco", email = "dcasasor@purdue.edu"},
]
keywords = [
    "chemical-engineering",
    "pharmaceutical",
    "process-modeling",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy<2",
    "scipy<1.14",
    "assimulo==3.4.3",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/SECQUOIA/PharmaPy"
Repository = "https://github.com/SECQUOIA/PharmaPy"
"Bug Tracker" = "https://github.com/SECQUOIA/PharmaPy/issues"

[tool.setuptools.packages.find]
include = ["PharmaPy*"]
