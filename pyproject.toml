[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PharmaPy"
version = "0.0.1"
description = "A numerical platform for the digital design of pharmaceutical processes"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "Daniel Casas-Orozco", email = "dcasasor@purdue.edu"},
]
maintainers = [
    {name = "David Bernal"},
    {name = "Andres Cabeza"},
    {name = "Can Li"},
    {name = "Yirang Park"},
    {name = "Sergey Gusev"},
    {name = "Piyush Sharma"},
]
keywords = [
    "chemical-engineering",
    "pharmaceutical",
    "process-modeling",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pandas>=1.5",
]

[project.optional-dependencies]
assimulo = [
    "cython>=0.29,<3",
]
test = [
    "pytest",
]
docs = [
    "ipykernel>=6",
    "nbsphinx>=0.9",
    "sphinx>=7.2,<9",
    "sphinx-rtd-theme>=2,<4",
    "sphinxcontrib-bibtex>=2.6",
]

[project.urls]
Homepage = "https://github.com/PharmaPy-org/PharmaPy"
Repository = "https://github.com/PharmaPy-org/PharmaPy"
"Bug Tracker" = "https://github.com/PharmaPy-org/PharmaPy/issues"

[tool.setuptools.packages.find]
include = ["PharmaPy*"]
